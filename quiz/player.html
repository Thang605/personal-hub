<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quiz Live Show - Người Chơi (Mobile Player)</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#6366f1',
              600: '#4f46e5'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Paho MQTT over WebSocket -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

  <!-- PeerJS for WebRTC Real-time P2P -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <!-- Custom Quiz Styles -->
  <link rel="stylesheet" href="css/quiz.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Player App Main Root Container -->
  <div id="player-app"></div>

  <!-- Scripts -->
  <script src="js/sound-effects.js"></script>
  <script src="js/peer-network.js"></script>
  <script src="js/player-controller.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.playerApp) {
        window.playerApp.init();
      }
    });
  </script>
</body>
</html>
